# Build the Kernarium Linux runtime framework for iOS arm64 and upload
# it as an artifact. TermX links it on a Linux VM afterwards; the
# framework itself cannot be built there (upstream CMake refuses
# non-Apple hosts).
#
# Pipeline (adapted from spyboi-dev/opencode-inbuilt's
# .github/workflows/build-kernarium.yml on its kernarium-engine branch,
# same pinned Kernarium commit, same order):
#   1. Clone Kernarium at the pinned commit fbe12ee (no vendoring).
#   2. Build the upstream artifacts the runtime needs, in order:
#      - dependency prefixes: apple-gpu-vulkan-experiment (Mesa/Zink/
#        KosmicKrisp/libepoxy/virglrenderer), ios-network (GLib/libslirp),
#        kernel-host-tools (pahole + static libelf for the kernel's BTF)
#      - the mainline 6.18 arm64 kernel bundle, built from the pinned
#        source and published to .build/kernel/artifacts, then
#        accepted (its descriptor is rewritten from the bundle's own
#        manifest, see the accept step: a from-source rebuild can
#        never match the checked-in descriptor's release string,
#        because Kbuild embeds the replay HEAD abbrev and the replay
#        produces fresh commit objects on every run)
#      - the Kernarium runtime tree (cmake --preset kernarium-ios-device),
#        which produces KRuntime_6_18_4K.framework
#   3. Upload the device-slice KRuntime_6_18_4K.framework as an artifact.
#
# Deliberate deviation from upstream's packaging script
# (Kernarium/scripts/package-ios-frameworks.sh): it is NOT run here.
# It is a consumer of prebuilt artifacts that also demands the Android
# runtime tree (and its kernel) although TermX ships only the Linux
# runtime, and its checks (privacy manifests, dSYM stripping, no
# software renderer) are App Store concerns, not sideload ones. The
# Linux runtime framework is taken straight from the runtime-tree
# build output -- exactly the slice the packaging script itself
# consumes as its input. The Android runtime is never built.
#
# Runner limits (xcode-27 standard: 3 vCPU, 7 GB RAM, 14 GB disk):
# the GPU prefix build (full Mesa) and the kernel build are the long
# poles; every heavy step runs at --jobs 3, unneeded Xcode versions
# and simulator runtimes are removed up front, and the built prefixes
# + kernel bundle are cached (actions/cache) so a retry reuses them.
# Bump the cache key suffix (v1 -> v2 ...) when the workflow or the
# pinned commit changes in a way that must invalidate the cache.
#
# Triggered manually, or on pushes to main that touch this workflow.
name: Build Kernarium Linux framework

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-framework.yml'

permissions:
  contents: read

jobs:
  build:
    # xcode-27, not macos-26: the standard macos-26 image carries only
    # Xcode 26.0-26.6 (run 44708774155 proved it: no Xcode_27*.app at
    # all), and the pinned Kernarium code needs the iOS 27 SDK (see the
    # Select step). The xcode-27 preview image is GitHub-hosted and
    # free for this public repo.
    runs-on: xcode-27
    env:
      # Prepared dependency sources live on the case-sensitive volume
      # (some upstream trees have case-colliding paths); every
      # dependency build script reads this variable.
      UML_DEPENDENCY_SOURCE_ROOT: /Volumes/KernCase/deps-sources
    # NOTE: do NOT set IPHONEOS_DEPLOYMENT_TARGET at job level. Apple's
    # clang reads it and then targets iOS by default, so the HOST tools
    # build (gawk configure) compiles its test program for iOS and
    # fails with "cannot run C compiled programs" -- exactly what
    # killed run 44671186140 (and the same step in opencode-inbuilt
    # run 44670686952). The runtime-tree toolchain (cmake/toolchains/
    # Apple.cmake) sets CMAKE_OSX_SYSROOT and CMAKE_OSX_DEPLOYMENT_TARGET
    # itself from the preset, so no step needs the env var.
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          # The pinned Kernarium commit's audio code needs the iOS 27 SDK:
          # apple_microphone_input.mm uses AVAudioSession's iOS 27
          # lifecycle notifications (DidBecomeInactive,
          # ResumptionRecommendation) and AVAudioNode's iOS 27 tap with
          # an error: parameter. Xcode 26.6 ships only iPhoneOS26.5.sdk,
          # which lacks all three, so run 44703164346 died at [235/290]
          # on that file. The job runs on the xcode-27 image, whose
          # toolchain ships the iOS 27 SDK; pick the newest Xcode 27, and fail loudly listing what is installed
          # if none is present. On the xcode-27 image the default
          # Xcode.app is itself 27, so fall back to it and verify the
          # version if no versioned 27 bundle exists.
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            if [ -d /Applications/Xcode.app ]; then
              XCODE=/Applications/Xcode.app
              case "$(xcodebuild -version 2>/dev/null | head -1)" in
                "Xcode 27"*) ;;
                *) echo "default Xcode is not 27:"; xcodebuild -version; ls /Applications | grep -i xcode || true; exit 1 ;;
              esac
            else
              echo "no Xcode 27 found:"; ls /Applications | grep -i xcode || true; exit 1
            fi
          fi
          # Resolve the real path: Xcode's versioned bundles come in
          # pairs that are the same install, one a symlink to the other
          # (26.6.0.app and 26.6.app were; 27.x pairs the same way). Without
          # this, the Free-disk step below compares the unresolved
          # name, deletes the twin, and destroys the selected Xcode
          # (run 44672557923 died at the GPU prefix with
          # 'xcrun: error: SDK "iphoneos" cannot be located').
          # python3 realpath because BSD readlink has no -f.
          XCODE="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$XCODE")"
          echo "Using $XCODE"
          echo "XCODE=$XCODE" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          echo "--- Xcode versions ---"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          # Keep only the selected Xcode; other versions are ~15 GB each.
          for x in /Applications/Xcode_*.app; do
            if [ "$x" != "$XCODE" ]; then echo "removing $x"; sudo rm -rf "$x"; fi
          done
          # Simulator runtimes are not used by a device-only build.
          if [ -d /Library/Developer/CoreSimulator/Profiles/Runtimes ]; then
            sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          fi
          df -h /

      - name: Install host tools
        run: |
          # Git identity for patch-series replay (local CI operations only).
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Check each host tool; install only what's missing.
          # NOTE: macOS ships /usr/bin/bison (2.3, too old for Mesa),
          # /usr/bin/libtool (Apple's, not GNU's) and no gmake, so the
          # checks below look for the Homebrew names, not the system ones.
          NEED=""
          check() {
            if command -v "$1" >/dev/null 2>&1; then echo "have $1"; else echo "missing $1 -> brew $2"; NEED="$NEED $2"; fi
          }
          check cmake cmake
          check ninja ninja
          check meson meson
          check pkg-config pkg-config
          check gmake make
          check bison bison
          check flex flex
          check rsync rsync
          check autoconf autoconf
          check automake automake
          check glibtoolize libtool
          check gettext gettext
          check gperf gperf
          check groff groff
          if [ -n "$NEED" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install $(echo "$NEED" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          # bison, flex, make, libtool and gettext are keg-only: their
          # binaries live under $(brew --prefix <formula>)/bin and are
          # NOT linked into /opt/homebrew/bin, so put those dirs first
          # on PATH for every later step. (Homebrew LLVM is deliberately
          # NOT added: the app/runtime builds use xcrun clang, and the
          # kernel steps get the LLVM bin dir explicitly.)
          for f in bison flex make libtool gettext; do
            echo "$(brew --prefix "$f")/bin" >> "$GITHUB_PATH"
          done
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix make)/bin:$(brew --prefix libtool)/bin:$(brew --prefix gettext)/bin:$PATH"
          # autoreconf looks for `libtoolize`; Homebrew installs it as
          # `glibtoolize`. A symlink makes the elfutils/libffi builds work.
          if ! command -v libtoolize >/dev/null 2>&1; then
            sudo ln -sf "$(brew --prefix libtool)/bin/glibtoolize" /usr/local/bin/libtoolize
          fi
          echo "bison: $(command -v bison) $(bison --version | head -1)"
          echo "flex: $(command -v flex) $(flex --version)"
          echo "gmake: $(command -v gmake) $(gmake --version | head -1)"
          echo "libtoolize: $(command -v libtoolize)"
          # The kernel links ELF with ld.lld and publishes with
          # llvm-objcopy. Homebrew llvm 23+ split LLD into a separate
          # `lld` formula, so `llvm` alone no longer provides ld.lld
          # (run 44676637886 died in build-kernel.sh with "linker is
          # unavailable: ld.lld" even though LLVM_BIN pointed at the
          # freshly installed llvm prefix). Install both, and put
          # lld's bin dir on PATH for every later step.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm lld
          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "LLVM tools: $LLVM_BIN"
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix lld)/bin:$PATH"
          command -v ld.lld >/dev/null 2>&1 || { echo "ld.lld still missing after brew install"; exit 1; }
          command -v "$LLVM_BIN/clang" >/dev/null 2>&1 || { echo "clang missing from $LLVM_BIN"; exit 1; }
          command -v "$LLVM_BIN/llvm-objcopy" >/dev/null 2>&1 || { echo "llvm-objcopy missing from $LLVM_BIN"; exit 1; }
          # Python 3.11+ and the modules the GPU build needs.
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' 2>/dev/null; then
            echo "python3 is older than 3.11; installing python@3.12"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install python@3.12
            echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
            export PATH="$(brew --prefix python@3.12)/bin:$PATH"
          fi
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11)' || { echo "python3 is older than 3.11"; exit 1; }
          python3 -c 'import mako, packaging, yaml' 2>/dev/null || \
            python3 -m pip install --user mako packaging pyyaml || \
            python3 -m pip install --break-system-packages mako packaging pyyaml

      - name: Clone Kernarium (pinned commit)
        run: |
          git init kernarium
          cd kernarium
          git remote add origin https://github.com/imxieyi/Kernarium.git
          git fetch --depth 1 origin fbe12ee72d195f0241c4fc24090a98b259026604
          git checkout FETCH_HEAD
          test "$(git rev-parse HEAD)" = fbe12ee72d195f0241c4fc24090a98b259026604

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            kernarium/.build/dependency-cache
            kernarium/.build/kernel-cache
            kernarium/.build/dependencies
            kernarium/.build/kernel/artifacts
          key: kernarium-deps-fbe12ee-v1
          restore-keys: |
            kernarium-deps-fbe12ee-

      - name: Create case-sensitive volume
        run: |
          # The Linux kernel source (and some dependency sources) has
          # paths that differ only by case; the runner's volume is
          # case-insensitive, so they live on a case-sensitive image.
          IMG="$RUNNER_TEMP/KernCase.sparseimage"
          rm -f "$IMG"
          hdiutil create -size 20g -fs "Case-sensitive APFS" -volname KernCase -type SPARSE "$IMG"
          hdiutil attach "$IMG" -mountpoint /Volumes/KernCase
          mkdir -p /Volumes/KernCase/deps-sources /Volumes/KernCase/kernel-build
          # NOTE: do NOT create /Volumes/KernCase/linux here.
          # prepare-source.sh materializes the kernel checkout there
          # and materialize-git.sh refuses if the destination already
          # exists ("destination already exists: /Volumes/KernCase/linux"
          # killed run 44673753042 in the kernel bundle step).
          # Prove the volume is case-sensitive.
          mkdir -p /Volumes/KernCase/.casetest
          touch /Volumes/KernCase/.casetest/a /Volumes/KernCase/.casetest/A
          [ "$(ls /Volumes/KernCase/.casetest | wc -l | tr -d ' ')" -eq 2 ] || { echo "volume is not case-sensitive"; exit 1; }
          rm -rf /Volumes/KernCase/.casetest
          # Kernel source location (git-ignored config in the checkout).
          printf '%s\n' 'UML_KERNEL_SOURCE_DIR=/Volumes/KernCase/linux' > kernarium/kernel/mainline-6.18/source-location.conf
          df -h /

      - name: Prepare dependencies
        run: |
          cd kernarium
          # prepare.sh fetches pinned sources from several upstreams;
          # a transient upstream failure (Savannah returned HTTP 502
          # for gawk on run 44669547801) must not fail the whole build,
          # so each product is retried up to 3 times.
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "giving up after 3 attempts: $*"; return 1; fi
              echo "attempt $n failed, retrying in 30s: $*"
              sleep 30
            done
          }
          retry ./dependencies/prepare.sh --product apple-gpu-vulkan-experiment --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --product ios-network --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --product kernel-host-tools --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --archive-manifest dependencies/kernel-host-tools/archives.tsv

      - name: Build kernel host tools
        run: |
          cd kernarium
          # A cached prefix that no longer verifies is deleted and
          # rebuilt instead of failing the job.
          ./dependencies/build-kernel-host-tools.sh --verify-only || rm -rf .build/dependencies/kernel-host-tools
          ./dependencies/build-kernel-host-tools.sh --jobs 3

      - name: Build Apple GPU prefix (iOS device)
        run: |
          cd kernarium
          ./dependencies/build-apple-gpu.sh --platform ios --verify-only || rm -rf .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
          ./dependencies/build-apple-gpu.sh --platform ios --jobs 3
          df -h /

      - name: Build iOS network prefix
        run: |
          cd kernarium
          ./dependencies/build-ios-network.sh --platform ios --verify-only || rm -rf .build/dependencies/ios-device-arm64/network
          ./dependencies/build-ios-network.sh --platform ios --jobs 3

      - name: Build Linux kernel bundle (arm64, 4K)
        run: |
          cd kernarium
          # verify-kernel-artifact.py requires an absolute --artifact
          # path ("artifact root must be an absolute local path" killed
          # run 44682700752 in the accept step, and silently failed
          # this reuse check on every earlier run, so the kernel was
          # rebuilt from source each time instead of reusing the cache).
          BUNDLE="$PWD/.build/kernel/artifacts/mainline-6.18-arm64-4k-20261119-6.18.60-ca1"
          # Compatibility-only reuse check: NO --descriptor here. The
          # descriptor in a fresh checkout records the release string
          # upstream accepted (6.18.60-g0f1aac6de72d), but a bundle built
          # in any earlier run carries a different one (the replay HEAD
          # changes every run), so a descriptor comparison would fail
          # the reuse check forever and rebuild the kernel every time.
          # The accept step below rewrites the descriptor from whatever
          # bundle this step leaves behind, so the runtime-tree import
          # always sees a matching pair.
          if [ -d "$BUNDLE" ] && python3 kernel/common/artifacts/verify-kernel-artifact.py \
              --artifact "$BUNDLE" --common-root kernel/common \
              --abi-metadata kernel/common/abi/identity.env --compatible \
              --expected-family mainline-6.18 --expected-slice arm64 \
              --expected-release-series 6.18; then
            echo "reusing verified kernel bundle: $BUNDLE"
            exit 0
          fi
          echo "kernel bundle missing or invalid; rebuilding from source"
          rm -rf "$BUNDLE"
          ./kernel/mainline-6.18/scripts/prepare-source.sh --slice arm64
          export PATH="$LLVM_BIN:$PATH"
          export UML_KERNEL_CC="$LLVM_BIN/clang"
          export UML_KERNEL_HOST_CC="$LLVM_BIN/clang"
          ./kernel/mainline-6.18/build/build-kernel.sh --slice arm64 --build /Volumes/KernCase/kernel-build --jobs 3
          python3 kernel/mainline-6.18/build/publish-artifact.py \
            --source /Volumes/KernCase/linux \
            --build /Volumes/KernCase/kernel-build \
            --slice arm64 --product linux \
            --output-root "$PWD/.build/kernel/artifacts" \
            --release-id 20261119-6.18.60-ca1 \
            --objcopy "$LLVM_BIN/llvm-objcopy"
          test -f "$BUNDLE/kernel/vmlinux"
          df -h /

      - name: Accept the built kernel bundle
        run: |
          cd kernarium
          # Upstream's rule (AGENTS.md, Release builds): an embedded
          # artifact's change reaches users only through a rebuilt and
          # accepted artifact, named by its accepted-*.env descriptor.
          # The runtime-tree import verifies the bundle against that
          # descriptor, field for field. A from-source rebuild can
          # never match the checked-in one: run 44678970463 proved it,
          # the bundle manifest says 6.18.60-gf501b2ce54cf while the
          # descriptor says 6.18.60-g0f1aac6de72d, because Kbuild's
          # release string embeds the replay HEAD abbrev and the
          # patch-series replay mints fresh commit objects on every
          # run (run 44676637886's HEAD was 779ad0e7489ea, this run's
          # is f501b2ce54cf, same canonical tree ee913342). So this
          # step accepts the bundle this run built (or reused): it
          # rewrites the descriptor from the bundle's own manifest,
          # then re-verifies the pair with --descriptor. The
          # descriptor lives only in this run's ephemeral checkout;
          # nothing in the repo or upstream is modified.
          BUNDLE="$PWD/.build/kernel/artifacts/mainline-6.18-arm64-4k-20261119-6.18.60-ca1"
          python3 - "$BUNDLE" <<'EOF'
          import json, pathlib, sys
          bundle = pathlib.Path(sys.argv[1])
          manifest = json.loads((bundle / "kernel-artifact.json").read_text())
          desc = pathlib.Path("kernel/mainline-6.18/artifacts/accepted-4k.env")
          lines = [
              "# SPDX-License-Identifier: GPL-2.0-or-later",
              f"UML_KERNEL_ARTIFACT_SCHEMA={manifest['schema_version']}",
              f"UML_KERNEL_ARTIFACT_RELEASE_ID='{manifest['release_id']}'",
              f"UML_KERNEL_ARTIFACT_DIRECTORY_NAME='{manifest['directory_name']}'",
              f"UML_KERNEL_ARTIFACT_FAMILY='{manifest['family']}'",
              f"UML_KERNEL_ARTIFACT_SLICE='{manifest['slice']}'",
              f"UML_KERNEL_ARTIFACT_RELEASE='{manifest['release']}'",
              f"UML_KERNEL_ARTIFACT_PAGE_SIZE={manifest['page_size']}",
              f"UML_KERNEL_ARTIFACT_FINAL_TREE='{manifest['source']['final_tree']}'",
              f"UML_KERNEL_ARTIFACT_ABI_VERSION={manifest['abi']['version']}",
              f"UML_KERNEL_ARTIFACT_ABI_FINGERPRINT='{manifest['abi']['fingerprint']}'",
          ]
          desc.write_text("\n".join(lines) + "\n")
          print("accepted kernel bundle:", manifest["release"])
          EOF
          python3 kernel/common/artifacts/verify-kernel-artifact.py \
            --artifact "$BUNDLE" --common-root kernel/common \
            --abi-metadata kernel/common/abi/identity.env --compatible \
            --expected-family mainline-6.18 --expected-slice arm64 \
            --expected-release-series 6.18 \
            --descriptor kernel/mainline-6.18/artifacts/accepted-4k.env

      - name: Stage the boot base archive
        run: |
          cd kernarium
          # The runtime tree embeds the accepted guest boot base archive
          # (tools/rootfs/boot-ramdisk/accepted-aarch64.env) and refuses
          # a missing or mismatched one (run 44686423966 died here).
          # Upstream publishes it in a starter release, which does not
          # exist for this pinned commit, so TermX ships its own base,
          # built on Linux with upstream's producer
          # (build-boot-base.sh: Buildroot 2026.05.3 + BusyBox 1.38.0,
          # the same pinned inputs as
          # tools/rootfs/starter/build-all.sh --product boot-base-aarch64).
          # Accept it the same way as the kernel bundle: rewrite the
          # descriptor in this run's ephemeral checkout from the
          # archive's own size and SHA-256, then verify the pair with
          # upstream's verify_base.py.
          RELEASE=termx-20261120-boot-base-r1
          DEST=".build/rootfs/$RELEASE"
          mkdir -p "$DEST"
          cp "$GITHUB_WORKSPACE/boot-base/uml-boot-base-aarch64.cpio.gz" \
            "$DEST/uml-boot-base-aarch64.cpio.gz"
          python3 - "$DEST/uml-boot-base-aarch64.cpio.gz" <<'EOF'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          data = archive.read_bytes()
          desc = pathlib.Path("tools/rootfs/boot-ramdisk/accepted-aarch64.env")
          lines = [
              "# SPDX-License-Identifier: GPL-2.0-or-later",
              "UML_BOOT_BASE_SCHEMA=1",
              "UML_BOOT_BASE_RELEASE='termx-20261120-boot-base-r1'",
              "UML_BOOT_BASE_FILE='uml-boot-base-aarch64.cpio.gz'",
              "UML_BOOT_BASE_ARCHITECTURE='aarch64'",
              f"UML_BOOT_BASE_SIZE={len(data)}",
              f"UML_BOOT_BASE_SHA256='{hashlib.sha256(data).hexdigest()}'",
          ]
          desc.write_text("\n".join(lines) + "\n")
          print("accepted boot base:", len(data), "bytes, sha256",
                hashlib.sha256(data).hexdigest())
          EOF
          python3 tools/rootfs/boot-ramdisk/verify_base.py \
            --descriptor tools/rootfs/boot-ramdisk/accepted-aarch64.env \
            --archive "$DEST/uml-boot-base-aarch64.cpio.gz"

      - name: Build Kernarium runtime tree
        run: |
          cd kernarium
          cmake --preset kernarium-ios-device
          cmake --build --preset kernarium-ios-device --parallel 3
          test -d .build/kernarium-runtime-ios-device/Kernarium/Runtime/KRuntime_6_18_4K.framework
          df -h /

      - name: Verify the Linux framework
        run: |
          FW=kernarium/.build/kernarium-runtime-ios-device/Kernarium/Runtime/KRuntime_6_18_4K.framework
          test -d "$FW"
          ls -lh "$FW"
          lipo -info "$FW/KRuntime_6_18_4K"
          # The kernel rides inside the framework binary. llvm-objdump
          # lives in the Homebrew llvm bin dir, which is not on PATH
          # (only the lld dir was added); use $LLVM_BIN explicitly.
          # Bare llvm-objdump killed run 44708904462 here even though
          # the framework had built fine (51M arm64 binary).
          "$LLVM_BIN/llvm-objdump" -macho -sections "$FW/KRuntime_6_18_4K" | grep -q __uml_elf \
            || { echo "no __uml_elf section: kernel missing from framework"; exit 1; }
          # The entry point TermX calls.
          nm -gU "$FW/KRuntime_6_18_4K" | grep -q ' _kernarium_runtime_get_api_v28' \
            || { echo "runtime API symbol missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$FW/Info.plist"
          echo "KRuntime_6_18_4K.framework verified"

      - name: Upload Linux framework
        uses: actions/upload-artifact@v4
        with:
          name: KRuntime_6_18_4K
          path: kernarium/.build/kernarium-runtime-ios-device/Kernarium/Runtime/KRuntime_6_18_4K.framework
